[package]
name = "tauri-plugin-resonance-mobile"
version = "0.1.0"
authors = ["Resonance"]
description = "Native Android (Media3 ExoPlayer) and iOS (AVPlayer) background audio and provider auth bridge"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-resonance-mobile"
build = "build.rs"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
