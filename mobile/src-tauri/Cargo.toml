[package]
name = "resonance-mobile"
version = "0.1.2"
description = "Resonance Mobile Player for Android and iOS"
authors = ["Resonance"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "resonance_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-resonance-mobile = { path = "plugins/resonance-mobile" }
tokio = { version = "1.44", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
sha1 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2.5"
rquickjs = { version = "0.14.0", features = ["bindgen"] }
regex = "1"
base64 = "0.22"
percent-encoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
