# App-level ACL permissions.
#
# Defining any app permission turns on ACL checks for every custom command, so
# each command the frontend calls must be explicitly granted in a capability.

[[permission]]
identifier = "allow-start-soundcloud-login"
description = "Open the embedded SoundCloud sign-in window."
commands.allow = ["start_soundcloud_login"]

[[permission]]
identifier = "allow-start-ytmusic-login"
description = "Open the embedded YouTube Music sign-in window."
commands.allow = ["start_ytmusic_login"]

[[permission]]
identifier = "allow-uninstall-app"
description = "Launch the application uninstaller while preserving user data."
commands.allow = ["uninstall_app"]

[[permission]]
identifier = "allow-yt-proxy-commands"
description = "Allow YouTube Music stream resolution, search, and playlist commands."
commands.allow = [
  "resolve_yt_stream_url",
  "search_yt_tracks",
  "fetch_yt_playlist_tracks"
]

[[permission]]
identifier = "allow-finish-splash"
description = "Show the main window and close the splash window."
commands.allow = ["finish_splash"]

[[permission]]
identifier = "allow-restart-app"
description = "Cleanly restart the application after an update."
commands.allow = ["restart_app"]
