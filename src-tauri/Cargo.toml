[package]
name = "app"
version = "0.16.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1.44", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
sha1 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }
url = "2.5"
rquickjs = "0.14.0"
regex = "1"
base64 = "0.22"
percent-encoding = "2"
discord-rich-presence = "1.1.0"
md-5 = "0.11.0"
lofty = "0.25.5"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
whisper-rs = { version = "0.16.0", features = ["raw-api"] }
m3u8-rs = "6.0.1"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3"] }

# whisper.cpp is built by CMake; an optimized build type is picked from this package's opt-level.
# Without it dev builds transcribe several times slower.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[lints.clippy]
# Acknowledged by the audit and left as designed: the resolver/player tuples are wide on purpose and
# the transcribe command's error is small enough to stay unboxed. Everything else must stay clean,
# because CI runs clippy with -D warnings.
type_complexity = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
