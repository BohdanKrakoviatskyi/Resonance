[workspace]
resolver = "3"
members = [
    "crates/resonance-core",
    "crates/resonance-audio",
    "crates/resonance-auth",
    "crates/resonance-ui",
]

[workspace.package]
version = "0.15.0"
edition = "2024"
rust-version = "1.98"
authors = ["Resonance"]
license = "MIT"

[workspace.dependencies]
resonance-core = { path = "crates/resonance-core" }
resonance-audio = { path = "crates/resonance-audio" }

# UI / Material 3
gpui-kit = "0.9.1"
gpui-kit-material = { version = "0.1.4", default-features = false, features = ["full", "serde", "embedded-symbols"] }
gpui-kit-material-color = { version = "0.1.1", features = ["dynamic", "serde"] }
gpui-material-symbols = { version = "0.1.0", features = ["gpui-kit", "embed-assets"] }

# Async / Networking / Serialization
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Audio / DSP / Codecs
cpal = "0.18"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-opus = "0.1.3"
m3u8-rs = "6.0"
biquad = "0.6"
rustfft = "6.4"

# Backend / DB / JS / Crypto / Images
rusqlite = { version = "0.32", features = ["bundled"] }
rquickjs = "0.14.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "rayon"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
percent-encoding = "2"
regex = "1"
base64 = "0.22"

# OS Integration & Auth WebView Helper
wry = "0.57.2"
tao = "0.37.2"
souvlaki = { version = "0.9", default-features = false }
global-hotkey = "0.10"
rfd = "0.18"
